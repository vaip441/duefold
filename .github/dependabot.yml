version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint cannot run on TypeScript 7's native compiler yet.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: 'docker'
    directory: '/deploy'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
